apiVersion: v1
kind: ServiceAccount
metadata:
  name: adk-coding-workflow
imagePullSecrets:
  - name: regcred-prokube
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: adk-coding-workflow-executor
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: adk-coding-workflow-executor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: adk-coding-workflow-executor
subjects:
  - kind: ServiceAccount
    name: adk-coding-workflow
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: adk-coding-workflow-plan
  labels:
    app.kubernetes.io/name: adk-coding-workflow
    app.kubernetes.io/component: prototype
spec:
  entrypoint: plan
  serviceAccountName: adk-coding-workflow
  activeDeadlineSeconds: 300
  podMetadata:
    annotations:
      sidecar.istio.io/inject: "false"
  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 5m
  ttlStrategy:
    secondsAfterCompletion: 86400
  podSpecPatch: '{"runtimeClassName":"gvisor"}'
  arguments:
    parameters:
      - name: repository
      - name: issue
      - name: base
        value: main
  templates:
    - name: plan
      inputs:
        parameters:
          - name: repository
          - name: issue
          - name: base
      container:
        image: europe-west3-docker.pkg.dev/prokube-internal/prokube-customer/adk-coding-workflow:prototype-cg-20260804-161155
        imagePullPolicy: IfNotPresent
        args:
          - --repository
          - "{{inputs.parameters.repository}}"
          - --issue
          - "{{inputs.parameters.issue}}"
          - --base
          - "{{inputs.parameters.base}}"
          - --mode
          - plan
        env:
          - name: GH_TOKEN
            valueFrom:
              secretKeyRef:
                name: adk-coding-workflow-github
                key: token
                optional: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
